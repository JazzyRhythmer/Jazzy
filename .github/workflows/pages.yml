name: Deploy JAZZY website
on:
  push:
    branches: [main]
    paths: ['JAZZY-*-source.tar.gz', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jazzy-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Verify release archive and unpack the public site
        run: |
          echo 'e07f39bf4dc629a17b9535290536e94c0a87f87e79f059875a48258372e0fe5a  JAZZY-0.1.0-beta.1-source.tar.gz' | sha256sum -c -
          mkdir _site
          tar -xzf JAZZY-0.1.0-beta.1-source.tar.gz -C _site --strip-components=2 Jazzy-0.1.0-beta.1/www
          sed -i 's/JAZZY-Hortator-with-breaks\.fwsc/JAZZY-0.1.0-beta.1.fwsc/' _site/installer/index.html
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1.fwsc"' _site/installer/index.html
          cd _site/downloads
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
