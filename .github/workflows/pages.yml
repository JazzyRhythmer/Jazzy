name: Deploy JAZZY website
on:
  push:
    branches: [main]
    paths: ['JAZZY-*-source.tar.gz', 'JAZZY-web-pad.tar.gz', 'JAZZY-web-launch-film.tar.gz', 'JAZZY-web-companion-and-installer.tar.gz.b64', 'JAZZY-preset-refresh-20261109.tar.gz.*.b64', 'JAZZY-web-play-ready.patch', 'JAZZY-fixes-20261109.2.tar.gz.*.b64', 'JAZZY-installer-checks.patch', 'JAZZY-sidechain-20261109.3.tar.gz.*.b64', 'JAZZY-community.patch', 'JAZZY-launch-daybreak.mp4', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jazzy-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Verify release archive and unpack the public site
        run: |
          echo 'e07f39bf4dc629a17b9535290536e94c0a87f87e79f059875a48258372e0fe5a  JAZZY-0.1.0-beta.1-source.tar.gz' | sha256sum -c -
          mkdir _site
          tar -xzf JAZZY-0.1.0-beta.1-source.tar.gz -C _site --strip-components=2 Jazzy-0.1.0-beta.1/www
          echo '5ceedcd280fb61cedd593beca24efdb47ac44384bd6c933f39088c47b6a89632  JAZZY-web-pad.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-web-pad.tar.gz -C _site
          echo '689deb3d4bafbb80cf245e4619f265267161d1dbaa89c1cef8d7964b90a6d54b  JAZZY-web-launch-film.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-web-launch-film.tar.gz -C _site
          base64 --decode JAZZY-web-companion-and-installer.tar.gz.b64 > JAZZY-web-companion-and-installer.tar.gz
          echo '0ae2dbffea9a18dcc0e8610a3308b460119660af10d713b1b1885677d2edc1e1  JAZZY-web-companion-and-installer.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-web-companion-and-installer.tar.gz -C _site
          cat JAZZY-preset-refresh-20261109.tar.gz.{01,02,03,04,05,06}.b64 | base64 --decode > JAZZY-preset-refresh-20261109.tar.gz
          echo '770e6d68118230c53b41f3dedf73d45ca54e9be5907161b2e3efd708a202f609  JAZZY-preset-refresh-20261109.tar.gz' | sha256sum -c -
          mkdir _preset_refresh
          tar -xzf JAZZY-preset-refresh-20261109.tar.gz -C _preset_refresh
          cp -a _preset_refresh/site/. _site/
          patch --batch --fuzz=0 -d _site -p1 < JAZZY-web-play-ready.patch
          curl --fail --silent --show-error --retry 3 -o _site/emulator/fm1_web.wasm https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/5aaa010c59ba0c6b81c4423cbe310997c880f3bc/emulator/fm1_web.wasm
          echo '5e9cea87026f03672380cacfd4b198dad6c74a975a7d307826d3330f86bedd41  _site/emulator/fm1_web.wasm' | sha256sum -c -
          release_tree=Jazzy-0.1.0-beta.1
          mkdir _source
          tar -xzf JAZZY-0.1.0-beta.1-source.tar.gz -C _source --exclude="$release_tree/www"
          cp -a _preset_refresh/source/. "_source/$release_tree/"
          source_file=JAZZY-0.1.0-beta.1-20261109-source.tar.gz
          tar --sort=name --mtime='UTC 2026-11-09' --owner=0 --group=0 --numeric-owner -C _source -cf - "$release_tree" | gzip -n > "_site/downloads/$source_file"
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1-20261109.fwsc"' _site/installer/index.html
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1-20261109-source.tar.gz"' _site/installer/index.html
          cat JAZZY-fixes-20261109.2.tar.gz.{01,02,03,04,05}.b64 | base64 --decode > JAZZY-fixes-20261109.2.tar.gz
          echo '7f41217bf63fe32c6c29b2e6f874a603499b31f2fef43a3373cf4bcc5e2f0b1d  JAZZY-fixes-20261109.2.tar.gz' | sha256sum -c -
          mkdir _fixes
          tar -xzf JAZZY-fixes-20261109.2.tar.gz -C _fixes
          cp -a _fixes/site/. _site/
          cp -a _fixes/source/. "_source/$release_tree/"
          fixes_source=JAZZY-0.1.0-beta.1-20261109.2-source.tar.gz
          tar --sort=name --mtime='UTC 2026-11-09' --owner=0 --group=0 --numeric-owner -C _source -cf - "$release_tree" | gzip -n > "_site/downloads/$fixes_source"
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1-20261109.2.fwsc"' _site/installer/index.html
          patch --batch --fuzz=0 -d _site -p1 < JAZZY-installer-checks.patch
          cat JAZZY-sidechain-20261109.3.tar.gz.{01,02,03,04,05}.b64 | base64 --decode > JAZZY-sidechain-20261109.3.tar.gz
          echo '395a4f8e2a519a17b12735145f6c643812c143108735429be26f75f942199542  JAZZY-sidechain-20261109.3.tar.gz' | sha256sum -c -
          mkdir _sidechain
          tar -xzf JAZZY-sidechain-20261109.3.tar.gz -C _sidechain
          cp -a _sidechain/site/. _site/
          cp -a _sidechain/source/. "_source/$release_tree/"
          sidechain_source=JAZZY-0.1.0-beta.1-20261109.3-source.tar.gz
          tar --sort=name --mtime='UTC 2026-11-09' --owner=0 --group=0 --numeric-owner -C _source -cf - "$release_tree" | gzip -n > "_site/downloads/$sidechain_source"
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1-20261109.3.fwsc"' _site/installer/index.html
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1-20261109.3-source.tar.gz"' _site/installer/index.html
          grep -F 'id="confirm-notice"' _site/installer/index.html
          patch --batch --fuzz=0 -d _site -p1 < JAZZY-community.patch
          echo 'dfadc84d5042f44a7a07ebdfc449afccd90c0cf5a13be14cfe1da3ee3a2be2f9  JAZZY-launch-daybreak.mp4' | sha256sum -c -
          cp JAZZY-launch-daybreak.mp4 _site/assets/jazzy-launch.mp4
          sed -i 's@assets/jazzy-launch\.mp4"@assets/jazzy-launch.mp4?v=daybreak-circuit"@g' _site/index.html
          grep -F 'src="assets/jazzy-launch.mp4?v=daybreak-circuit"' _site/index.html
          curl --fail --silent --show-error --retry 3 -o JAZZY-audio-20261110.1.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/02783081455a0f688f4206743578c290321f9bfe/JAZZY-audio-20261110.1.tar.gz
          echo 'e6114688562221db07f26d2dd1d65ca97717dc7498f03eaa0c9e690b14c2556a  JAZZY-audio-20261110.1.tar.gz' | sha256sum -c -
          mkdir _audio_update
          tar -xzf JAZZY-audio-20261110.1.tar.gz -C _audio_update
          cp -a _audio_update/site/. _site/
          cp -a _audio_update/source/. "_source/$release_tree/"
          audio_source=JAZZY-0.1.0-beta.1-20261110.1-source.tar.gz
          tar --sort=name --mtime='UTC 2026-11-10' --owner=0 --group=0 --numeric-owner -C _source -cf - "$release_tree" | gzip -n > "_site/downloads/$audio_source"
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1-20261110.1.fwsc"' _site/installer/index.html
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1-20261110.1-source.tar.gz"' _site/installer/index.html
          grep -F 'WEB PLAY · BUILD 20261110.1' _site/emulator/index.html
          curl --fail --silent --show-error --retry 3 -o JAZZY-mixer-20261110.2.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/ea6dc65eeff1891451dd5ec4362b88717d6b834c/JAZZY-mixer-20261110.2.tar.gz
          echo '0892270ab1552703e2f64c09522212daa959d6b085d4d514d6b7cf274fab54ad  JAZZY-mixer-20261110.2.tar.gz' | sha256sum -c -
          mkdir _mixer_update
          tar -xzf JAZZY-mixer-20261110.2.tar.gz -C _mixer_update
          cp -a _mixer_update/site/. _site/
          cp -a _mixer_update/source/. "_source/$release_tree/"
          mixer_source=JAZZY-0.1.0-beta.1-20261110.2-source.tar.gz
          tar --sort=name --mtime='UTC 2026-11-10' --owner=0 --group=0 --numeric-owner -C _source -cf - "$release_tree" | gzip -n > "_site/downloads/$mixer_source"
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1-20261110.2.fwsc"' _site/installer/index.html
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1-20261110.2-source.tar.gz"' _site/installer/index.html
          grep -F 'WEB PLAY · BUILD 20261110.2' _site/emulator/index.html
          curl --fail --silent --show-error --retry 3 -o JAZZY-wavetable-web-20261110.3.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/9c02e14a172def94af5a2cd1ab7beb1b80f949d5/JAZZY-wavetable-web-20261110.3.tar.gz
          echo 'd90fc296b94ca82bde494c9914907e8657a7db806a896cd08cea7081de5421c0  JAZZY-wavetable-web-20261110.3.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-wavetable-web-20261110.3.tar.gz -C _site
          grep -F '"WAVETABLE"' _site/catalog.mjs
          curl --fail --silent --show-error --retry 3 -o JAZZY-wavetable-20261110.3.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/4f72b8426afdbc93b59b2db360016db10418d948/JAZZY-wavetable-20261110.3.tar.gz
          echo 'ff1530f07e7a42991298c20aeb69aa584bb1721c69d897d4e4fcd8962cb9e3d2  JAZZY-wavetable-20261110.3.tar.gz' | sha256sum -c -
          mkdir _wavetable_update
          tar -xzf JAZZY-wavetable-20261110.3.tar.gz -C _wavetable_update
          cp -a _wavetable_update/site/. _site/
          wavetable_source=JAZZY-0.1.0-beta.1-20261110.3-source.tar.gz
          tar --sort=name --mtime='UTC 2026-11-10' --owner=0 --group=0 --numeric-owner -C _wavetable_update -cf - "$release_tree" | gzip -n > "_site/downloads/$wavetable_source"
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1-20261110.3.fwsc"' _site/installer/index.html
          grep -F 'href="../downloads/JAZZY-0.1.0-beta.1-20261110.3-source.tar.gz"' _site/installer/index.html
          grep -F 'WEB PLAY · BUILD 20261110.3' _site/emulator/index.html
          grep -F '"WAVETABLE"' _site/catalog.mjs
          curl --fail --silent --show-error --retry 3 -o JAZZY-web-editor-20261110.3.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/780031a6b64161f79c50ef9c5f53e59605e4b37e/JAZZY-web-editor-20261110.3.tar.gz
          echo '08b91c63995907ae93650b42eadb56b2b96c2026def2bd494cf891ddda81d02b  JAZZY-web-editor-20261110.3.tar.gz' | sha256sum -c -
          mkdir _editor_update
          tar -xzf JAZZY-web-editor-20261110.3.tar.gz -C _editor_update
          cp -a _editor_update/site/. _site/
          cp -a _editor_update/source/. "_wavetable_update/$release_tree/"
          editor_source=JAZZY-web-editor-source-20261110.3.tar.gz
          tar --sort=name --mtime='UTC 2026-11-10' --owner=0 --group=0 --numeric-owner -C _wavetable_update -cf - "$release_tree" | gzip -n > "_site/downloads/$editor_source"
          test -s _site/editor/workspace.wasm
          grep -F 'href="editor/">Editor</a>' _site/index.html
          grep -F 'JAZZY — Web Editor' _site/editor/index.html
          python3 -c 'import json; assert json.load(open("_site/editor/factory-seed.json"))["hash"] == json.load(open("_site/release.json"))["sha256"]'
          curl --fail --silent --show-error --retry 3 -o JAZZY-sidechain-pixel-20261111.1.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/a963f8aa177bcfa9421410810ee0c49d5bdea0a3/JAZZY-sidechain-pixel-20261111.1.tar.gz
          echo 'a5bb4d918f7e4052f31a2982f16288895032c68352fd97e3fe7e3bfd15feb1d5  JAZZY-sidechain-pixel-20261111.1.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-sidechain-pixel-20261111.1.tar.gz -C _site
          curl --fail --silent --show-error --retry 3 -o _site/index.html https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/22f19cc22b33ccffa8481576eb6ca65fd8f86cbd/JAZZY-homepage-layout-20261111.html
          echo '7195bf82924e9f5babc1480d05d486063b523af1f6c51c704314ce75f3784302  _site/index.html' | sha256sum -c -
          grep -F 'id="manual"' _site/index.html
          grep -F 'id="update"' _site/index.html
          grep -F 'id="kick-link"' _site/manual/index.html
          grep -F 'WEB PLAY · BUILD 20261111.1' _site/emulator/index.html
          python3 -c 'import json; m=json.load(open("_site/installer/manifest.json"))["jazzy"]; assert m["build"] == "20261111.1" and m["sha256"] == json.load(open("_site/editor/factory-seed.json"))["hash"] == json.load(open("_site/release.json"))["sha256"]'
          curl --fail --silent --show-error --retry 3 -o JAZZY-startup-20261111.2.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/f0d9d18bd959b461732d09b9bb32d292a21446c5/JAZZY-startup-20261111.2.tar.gz
          echo '25a776f562600069fd3732a4c28c098347c1b55c5d2260fcef0d5b2e573dc7ac  JAZZY-startup-20261111.2.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-startup-20261111.2.tar.gz -C _site
          grep -F 'jazzy-startup.webp?v=20261111.2' _site/index.html
          grep -F 'WEB PLAY · BUILD 20261111.2' _site/emulator/index.html
          python3 -c 'import json; m=json.load(open("_site/installer/manifest.json"))["jazzy"]; assert m["build"] == "20261111.2" and m["sha256"] == json.load(open("_site/editor/factory-seed.json"))["hash"] == json.load(open("_site/release.json"))["sha256"]'
          curl --fail --silent --show-error --retry 3 -o JAZZY-launch-film-pixels-20261111.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/19bded371369ab30481326815fd7932e58322829/JAZZY-launch-film-pixels-20261111.tar.gz
          echo '944a947b7b102a936fbeaa2b544e1addce10e1e5af96e2966a0e3955aaccf205  JAZZY-launch-film-pixels-20261111.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-launch-film-pixels-20261111.tar.gz -C _site
          grep -F 'assets/jazzy-launch.mp4?v=wavetable-20261110.3' _site/index.html
          sed -i -e 's|assets/jazzy-launch.mp4?v=wavetable-20261110.3|assets/jazzy-launch.mp4?v=pixel-film-20261111|g' -e 's|poster="assets/jazzy-launch-poster.jpg"|poster="assets/jazzy-launch-poster.jpg?v=pixel-film-20261111"|' _site/index.html
          grep -F 'poster="assets/jazzy-launch-poster.jpg?v=pixel-film-20261111"' _site/index.html
          test -s _site/assets/jazzy-launch.mp4 && test -s _site/assets/jazzy-launch-poster.jpg
          curl --fail --silent --show-error --retry 3 -o _site/manual/index.html https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/e6903127c4029fb5b9876039925890e5b0b0ee29/JAZZY-manual-usb-sync-20261111.html
          echo '22c32a2c35611b3fbb7732d97c449ae70ad7806bedc9267cb9a2a2a9b1d5c44b  _site/manual/index.html' | sha256sum -c -
          grep -F 'id="usb-sync"' _site/manual/index.html
          grep -F 'id="kick-link"' _site/manual/index.html
          curl --fail --silent --show-error --retry 3 -o JAZZY-usb-clock-sync-20261111.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/db63f8617798510f2e8fca7a0ff0691527666cf2/JAZZY-usb-clock-sync-20261111.tar.gz
          echo 'af401ce34d349cf6a56a926ec62fccda365713be200ab34b2d06b349d7f7ddaa  JAZZY-usb-clock-sync-20261111.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-usb-clock-sync-20261111.tar.gz -C _site
          python3 -c 'import hashlib, json, pathlib; root=pathlib.Path("_site"); m=json.load(open(root/"installer/manifest.json"))["jazzy"]; fw=(root/"installer"/m["url"].split("?")[0]).read_bytes(); assert m["build"] == "20261111.2" and len(fw) == m["bytes"] and hashlib.sha256(fw).hexdigest() == m["sha256"] == json.load(open(root/"editor/factory-seed.json"))["hash"] == json.load(open(root/"release.json"))["sha256"]'
          curl --fail --silent --show-error --retry 3 -o JAZZY-live-sessions-20261111.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/228ff859dcbb4165b4595530ee7a22c65fda03b9/JAZZY-live-sessions-20261111.tar.gz
          echo '20dbd0133a754282afdfbedcc7cef9c5b69bf432d91fc9eec3ac228c622c1a3b  JAZZY-live-sessions-20261111.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-live-sessions-20261111.tar.gz -C _site
          grep -F 'youtube-nocookie.com/embed/3QUPD_offSk' _site/index.html
          test -s _site/performance-videos.css
          curl --fail --silent --show-error --retry 3 -o JAZZY-fullwidth-sessions-20261111.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/af135d1895f9d529cc37bfccd563e50bd3a2f673/JAZZY-fullwidth-sessions-20261111.tar.gz
          echo 'c4b5c2bba4aa99d79cc566b072671fda108f81bbcd875d8d6e8397550100d024  JAZZY-fullwidth-sessions-20261111.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-fullwidth-sessions-20261111.tar.gz -C _site
          grep -F 'performance-videos.css?v=2d487d76c0e7' _site/index.html
          curl --fail --silent --show-error --retry 3 -o JAZZY-editor-links-20261111.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/40d2d48114a626d63d2978def5d172a413cd86cd/JAZZY-editor-links-20261111.tar.gz
          echo 'd5df9c5df6dfeb46622b4abd80e829045aaec16390a94359e8c976059ddc130c  JAZZY-editor-links-20261111.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-editor-links-20261111.tar.gz -C _site
          grep -F 'href="editor/?target=browser">Editor</a>' _site/index.html
          grep -F 'href="../editor/?target=browser">EDITOR</a>' _site/installer/index.html
          grep -F 'href="../editor/?target=browser">Editor</a>' _site/manual/index.html

          curl --fail --silent --show-error --retry 3 -o JAZZY-sample-guide-20261111.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/4b799e4b95e02adc31f3d449134ed097d453e834/JAZZY-sample-guide-20261111.tar.gz
          echo '2a89850614280976682d050aec1c5eaf7c78cc70f298a7390a0286acbae03a36  JAZZY-sample-guide-20261111.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-sample-guide-20261111.tar.gz -C _site
          grep -F 'id="samples"' _site/manual/index.html
          grep -F 'sample-guide-20261111' _site/editor/index.html
          curl --fail --silent --show-error --retry 3 -o JAZZY-multi-break-20261111.3.tar.gz https://raw.githubusercontent.com/JazzyRhythmer/Rhythmer/4dac60eaeddb6072138b6d122d35be580288862e/JAZZY-multi-break-20261111.3.tar.gz
          echo '9c64b69d5b9184f448f95cb8a4eef69c20d199b773d100b4cfc2f15213c730b3  JAZZY-multi-break-20261111.3.tar.gz' | sha256sum -c -
          tar -xzf JAZZY-multi-break-20261111.3.tar.gz -C _site
          (cd _site/downloads && sha256sum -c MULTIBREAK-SHA256SUMS.txt)
          cd _site/downloads
          cat update-SHA256SUMS.txt startup-SHA256SUMS.txt >> SHA256SUMS.txt
          sha256sum "$editor_source" >> SHA256SUMS.txt
          echo '7e351056388089b3528040718187d34d00860bbbdf71e23eec5be2d1bc65570e  JAZZY-0.1.0-beta.1-20261110.3.fwsc' >> SHA256SUMS.txt
          sha256sum "$wavetable_source" >> SHA256SUMS.txt
          echo 'a36a6236d7695df70e5fce9ea27fe11dd8240846358b1650a3ba9916daa278fd  JAZZY-0.1.0-beta.1-20261110.2.fwsc' >> SHA256SUMS.txt
          sha256sum "$mixer_source" >> SHA256SUMS.txt
          echo '10325053d16f561d6f5194c54e8a92750eb0947fdfb32326ee2fb7b380ce9fea  JAZZY-0.1.0-beta.1-20261110.1.fwsc' >> SHA256SUMS.txt
          sha256sum "$audio_source" >> SHA256SUMS.txt
          echo '5042f4351e17a6b9222e4e7f96845fab5d9323f249a93e06a82a8b511bdbe51c  JAZZY-0.1.0-beta.1-20261109.2.fwsc' >> SHA256SUMS.txt
          echo '84899dae54d489a1afa827ec01647260291cd08678f9f94a9479ab9324386277  JAZZY-0.1.0-beta.1-20261109.3.fwsc' >> SHA256SUMS.txt
          sha256sum "$source_file" "$fixes_source" "$sidechain_source" >> SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
